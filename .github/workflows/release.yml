name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish (defaults to main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify Release Merge
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve release commit ref
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_OUTPUT"
          fi

  publish-rust:
    name: Publish Rust (crates.io)
    needs: gate
    uses: ./.github/workflows/publish-rust.yml
    with:
      ref: ${{ needs.gate.outputs.ref }}
    secrets: inherit

  publish-node:
    name: Publish Node.js (npm)
    needs: gate
    uses: ./.github/workflows/publish-node.yml
    with:
      ref: ${{ needs.gate.outputs.ref }}
    secrets: inherit

  # To add another language release target (e.g., Python/PyPI, Go, Java/Maven, PHP/PECL):
  # 1. Create `.github/workflows/publish-<lang>.yml` with `workflow_call` + `workflow_dispatch`.
  # 2. Add a `publish-<lang>` job here with `needs: gate`, `with: { ref: ${{ needs.gate.outputs.ref }} }`, and `secrets: inherit`.
