name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish (defaults to main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify Release Merge
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}

    steps:
      - name: Resolve release commit ref
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref || 'main' }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$MERGE_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          fi

  publish-rust:
    needs: gate
    uses: ./.github/workflows/publish-rust.yml
    with:
      ref: ${{ needs.gate.outputs.ref }}

  publish-node:
    needs: gate
    uses: ./.github/workflows/publish-node.yml
    with:
      ref: ${{ needs.gate.outputs.ref }}
    secrets: inherit