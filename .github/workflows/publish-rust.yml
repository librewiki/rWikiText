name: Publish Rust (crates.io)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to publish"
        required: false
        default: "main"
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check if version is already published on crates.io
        id: check
        run: |
          NAME="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["name"])')"
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: rWikiText-release-ci' "https://crates.io/api/v1/crates/${NAME}/${VERSION}")"
          if [ "$STATUS" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME} ${VERSION} is already published on crates.io; skipping."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io (Trusted Publishing)
        if: steps.check.outputs.already_published == 'false' && secrets.CARGO_REGISTRY_TOKEN == ''
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: steps.check.outputs.already_published == 'false'
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          if ! cargo publish --locked; then
            echo "::warning::cargo publish failed for ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }} (e.g. version conflict or auth issue); continuing."
          fi
