name: Publish Node.js (npm)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to publish"
        required: false
        default: "main"
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            os: ubuntu-latest
            use_zig: true
            abi_suffix: "2.17"
            musl: false
            ext: so
            lib_prefix: lib
            test: true
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            os: ubuntu-latest
            use_zig: true
            abi_suffix: "2.17"
            musl: false
            ext: so
            lib_prefix: lib
            test: false
          - target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            os: ubuntu-latest
            use_zig: true
            abi_suffix: ""
            musl: true
            ext: so
            lib_prefix: lib
            test: false
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            os: ubuntu-latest
            use_zig: true
            abi_suffix: ""
            musl: true
            ext: so
            lib_prefix: lib
            test: false
          - target: x86_64-apple-darwin
            platform: darwin-x64
            os: macos-latest
            use_zig: false
            abi_suffix: ""
            musl: false
            ext: dylib
            lib_prefix: lib
            test: false
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            os: macos-latest
            use_zig: false
            abi_suffix: ""
            musl: false
            ext: dylib
            lib_prefix: lib
            test: true
          - target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            os: windows-latest
            use_zig: false
            abi_suffix: ""
            musl: false
            ext: dll
            lib_prefix: ""
            test: true
          - target: aarch64-pc-windows-msvc
            platform: win32-arm64-msvc
            os: windows-latest
            use_zig: false
            abi_suffix: ""
            musl: false
            ext: dll
            lib_prefix: ""
            test: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/node

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      - name: Install Zig
        if: matrix.use_zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Install cargo-zigbuild
        if: matrix.use_zig
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build native addon (cargo-zigbuild)
        if: matrix.use_zig
        working-directory: bindings/node
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          if [ -n "${{ matrix.abi_suffix }}" ]; then
            TARGET="${TARGET}.${{ matrix.abi_suffix }}"
          fi
          if [ "${{ matrix.musl }}" = "true" ]; then
            export RUSTFLAGS="-C target-feature=-crt-static"
          fi
          cargo zigbuild --locked --release --target "$TARGET"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib_prefix }}rwikitext_node.${{ matrix.ext }}" \
            "rwikitext.${{ matrix.platform }}.node"

      - name: Build native addon (cargo)
        if: ${{ !matrix.use_zig }}
        working-directory: bindings/node
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib_prefix }}rwikitext_node.${{ matrix.ext }}" \
            "rwikitext.${{ matrix.platform }}.node"

      - name: Smoke test native addon
        if: matrix.test
        working-directory: bindings/node
        shell: bash
        run: npm test

      - name: Upload native addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.platform }}
          path: bindings/node/rwikitext.${{ matrix.platform }}.node
          if-no-files-found: error

name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish (defaults to main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify Release Merge
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}

    steps:
      - name: Resolve release commit ref
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref || 'main' }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$MERGE_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          fi

  publish-rust:
    name: Publish Rust (crates.io)
    needs: gate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-rust.yml
    with:
      ref: ${{ needs.gate.outputs.ref }}

  publish-node:
    name: Publish Node.js (npm)
    needs: gate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-node.yml
    with:
      ref: ${{ needs.gate.outputs.ref }}