[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwikitext"
version = "1.0.0"
description = "Python binding for rWikiText (MediaWiki wikitext, NamuMark, GFM, and HTML converter)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = [
    "wikitext",
    "mediawiki",
    "namumark",
    "gfm",
    "markdown",
    "html",
    "converter",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://rwikitext.librewiki.net"
Repository = "https://github.com/librewiki/rWikiText"
Issues = "https://github.com/librewiki/rWikiText/issues"

[tool.setuptools.packages.find]
include = ["rwikitext*"]

[tool.setuptools.package-data]
rwikitext = ["*.so", "*.dylib", "*.dll"]
