[package]
name = "rwikitext"
version = "1.0.1"
edition = "2021"
license = "MIT"
description = "Convert documents between MediaWiki wikitext, NamuMark (alpha), GFM, and HTML with page metadata and conversion-loss diagnostics"
readme = "README.md"
repository = "https://github.com/librewiki/rWikiText"
documentation = "https://docs.rs/rwikitext"
homepage = "https://rwikitext.librewiki.net"
keywords = ["mediawiki", "wikitext", "namumark", "markdown", "html"]
categories = ["text-processing", "parsing", "command-line-utilities"]
exclude = [
    "AGENTS.md",
    "docs/",
    "bindings/",
    "examples/",
    "scripts/",
    "release-artifacts/",
]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html-escape = "0.2"
comrak = { version = "0.35", default-features = false }

[dev-dependencies]
pulldown-cmark = "0.13"
