[package]
name = "rwikitext"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html-escape = "0.2"
comrak = { version = "0.35", default-features = false }

[dev-dependencies]
pulldown-cmark = "0.13"
