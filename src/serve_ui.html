<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rWikiText Playground</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-alt: #f0f3f6;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #59636e;
      --accent: #0969da;
      --accent-soft: #ddf4ff;
      --danger: #cf222e;
      --danger-soft: #ffebe9;
      --warn: #9a6700;
      --warn-soft: #fff8c5;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-alt: #1f242c;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent-soft: rgba(56, 139, 253, 0.15);
        --danger: #f85149;
        --danger-soft: rgba(248, 81, 73, 0.15);
        --warn: #d29922;
        --warn-soft: rgba(187, 128, 9, 0.18);
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header.toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .brand {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.01em;
      margin-right: 6px;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    select, button {
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
    }

    select:focus, button:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .metric-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
    }

    .metric-label {
      font-family: var(--sans);
      font-weight: 500;
      opacity: 0.85;
    }

    main.workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
    }

    @media (max-width: 820px) {
      main.workspace {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }

    section.pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--surface);
    }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .pane-title {
      font-weight: 600;
    }

    .pane-meta {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .tabs {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    .tab-btn {
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    textarea#source-input {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: none;
      resize: none;
      padding: 14px 16px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.55;
      tab-size: 2;
    }

    .output-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    #raw-panel {
      flex: 1;
      min-height: 0;
      overflow: auto;
      margin: 0;
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #preview-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    #preview-panel[hidden], #raw-panel[hidden] {
      display: none;
    }

    .preview-status {
      padding: 8px 14px;
      font-size: 12px;
      color: var(--muted);
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
    }

    .preview-status[hidden] {
      display: none;
    }

    #preview-mount {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    iframe.preview-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    .diagnostics-bar {
      max-height: 140px;
      overflow: auto;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
      background: var(--warn-soft);
      color: var(--warn);
    }

    .diagnostics-bar.error {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .diagnostics-bar[hidden] {
      display: none;
    }

    .diagnostics-bar ul {
      margin: 0;
      padding-left: 18px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-group">
        <span class="brand">rWikiText</span>
        <label class="field">
          <span>Source</span>
          <select id="source-format" aria-label="Source markup">
            <option value="wikitext">MediaWiki Wikitext</option>
            <option value="namumark">NamuMark</option>
            <option value="gfm">GFM</option>
            <option value="html">HTML</option>
          </select>
        </label>
        <button id="swap-btn" type="button" title="Swap source and target">⇄</button>
        <label class="field">
          <span>Target</span>
          <select id="target-format" aria-label="Target markup">
            <option value="html">HTML</option>
            <option value="gfm">GFM</option>
            <option value="namumark">NamuMark</option>
            <option value="wikitext">MediaWiki Wikitext</option>
          </select>
        </label>
        <label class="toggle-label">
          <input id="strict-mode" type="checkbox">
          <span>Strict</span>
        </label>
      </div>
      <div class="toolbar-group">
        <span class="metric-badge" id="elapsed-badge" title="Server-side conversion duration">
          <span class="metric-label">Convert</span>
          <span id="elapsed-time">0 µs</span>
        </span>
      </div>
    </header>

    <main class="workspace">
      <section class="pane">
        <div class="pane-header">
          <span class="pane-title">Source</span>
          <div class="toolbar-group">
            <span class="pane-meta" id="input-stats">0 chars</span>
            <button id="clear-btn" type="button">Clear</button>
          </div>
        </div>
        <textarea
          id="source-input"
          spellcheck="false"
          placeholder="Enter source markup here..."
        >== Hello rWikiText ==

This is '''bold''', ''italic'', and a [[Wiki Link|wiki link]].

* First item
* Second item</textarea>
      </section>

      <section class="pane">
        <div class="pane-header">
          <div class="tabs" role="tablist" aria-label="Output view">
            <button id="tab-raw" class="tab-btn active" type="button" role="tab" aria-selected="true">Raw</button>
            <button id="tab-preview" class="tab-btn" type="button" role="tab" aria-selected="false">Preview</button>
          </div>
          <div class="toolbar-group">
            <span class="pane-meta" id="output-stats">0 chars</span>
            <button id="copy-btn" type="button">Copy</button>
          </div>
        </div>

        <div class="output-container">
          <pre id="raw-panel"><code id="raw-output"></code></pre>
          <div id="preview-panel" hidden>
            <div id="preview-status" class="preview-status" hidden></div>
            <div id="preview-mount"></div>
          </div>
          <div id="diagnostics-bar" class="diagnostics-bar" hidden></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const SUPPORTED_TARGETS = {
        wikitext: ["html", "gfm", "namumark"],
        namumark: ["html", "wikitext", "gfm"],
        gfm: ["wikitext", "namumark"],
        html: ["wikitext", "namumark"]
      };

      const sourceSelect = document.getElementById("source-format");
      const targetSelect = document.getElementById("target-format");
      const swapBtn = document.getElementById("swap-btn");
      const strictCheckbox = document.getElementById("strict-mode");
      const elapsedTimeEl = document.getElementById("elapsed-time");
      const sourceInput = document.getElementById("source-input");
      const inputStats = document.getElementById("input-stats");
      const outputStats = document.getElementById("output-stats");
      const clearBtn = document.getElementById("clear-btn");
      const copyBtn = document.getElementById("copy-btn");
      const tabRaw = document.getElementById("tab-raw");
      const tabPreview = document.getElementById("tab-preview");
      const rawPanel = document.getElementById("raw-panel");
      const rawOutput = document.getElementById("raw-output");
      const previewPanel = document.getElementById("preview-panel");
      const previewStatus = document.getElementById("preview-status");
      const previewMount = document.getElementById("preview-mount");
      const diagnosticsBar = document.getElementById("diagnostics-bar");

      let activeTab = "raw";
      let debounceTimer = null;
      let convertSeq = 0;
      let previewSeq = 0;
      let resultVersion = 0;
      let renderedPreviewVersion = -1;
      let lastResult = { target: targetSelect.value, content: "", ok: false };
      let previewFrame = null;

      function syncTargetOptions() {
        const source = sourceSelect.value;
        const allowed = SUPPORTED_TARGETS[source] || [];
        for (const opt of targetSelect.options) {
          opt.disabled = !allowed.includes(opt.value);
        }
        if (!allowed.includes(targetSelect.value) && allowed.length > 0) {
          targetSelect.value = allowed[0];
        }
        const canSwap = (SUPPORTED_TARGETS[targetSelect.value] || []).includes(source);
        swapBtn.disabled = !canSwap;
      }

      function formatMicroseconds(us) {
        if (typeof us !== "number" || !Number.isFinite(us)) {
          return "-";
        }
        return `${us.toLocaleString()} µs`;
      }

      function updateInputStats() {
        inputStats.textContent = `${sourceInput.value.length.toLocaleString()} chars`;
      }

      function renderDiagnostics(errorMsg, diagnostics) {
        if (!errorMsg && (!diagnostics || diagnostics.length === 0)) {
          diagnosticsBar.hidden = true;
          diagnosticsBar.classList.remove("error");
          diagnosticsBar.textContent = "";
          return;
        }
        diagnosticsBar.hidden = false;
        diagnosticsBar.classList.toggle("error", Boolean(errorMsg));
        diagnosticsBar.textContent = "";

        if (errorMsg) {
          const p = document.createElement("div");
          p.textContent = `Error: ${errorMsg}`;
          diagnosticsBar.appendChild(p);
        }
        if (diagnostics && diagnostics.length > 0) {
          const ul = document.createElement("ul");
          for (const d of diagnostics) {
            const li = document.createElement("li");
            li.textContent = d.display || d.message;
            ul.appendChild(li);
          }
          diagnosticsBar.appendChild(ul);
        }
      }

      function buildPreviewSrcdoc(fragmentHtml) {
        const lazyHtml = fragmentHtml.replace(/<img\b(?![^>]*\bloading=)/gi, '<img loading="lazy"');
        return `<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Helvetica, Arial, sans-serif;
      line-height: 1.65;
      color: #1f2328;
      background: #ffffff;
      margin: 0;
      padding: 16px 20px;
      word-break: break-word;
    }
    h1, h2, h3, h4, h5, h6 {
      margin-top: 1.2em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }
    h1, h2 {
      border-bottom: 1px solid #d0d7de;
      padding-bottom: 0.25em;
    }
    pre, code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #f6f8fa;
      border-radius: 4px;
    }
    code { padding: 0.15em 0.35em; font-size: 0.92em; }
    pre { padding: 12px; overflow: auto; }
    pre code { padding: 0; background: transparent; }
    table { border-collapse: collapse; margin: 12px 0; max-width: 100%; }
    th, td { border: 1px solid #d0d7de; padding: 6px 10px; }
    th { background: #f6f8fa; }
    blockquote {
      margin: 10px 0;
      padding: 4px 14px;
      border-left: 4px solid #d0d7de;
      color: #59636e;
    }
    img { max-width: 100%; height: auto; }
    a { color: #0969da; }
  </style>
</head>
<body>${lazyHtml}</body>
</html>`;
      }

      function ensurePreviewFrame() {
        if (!previewFrame) {
          previewFrame = document.createElement("iframe");
          previewFrame.className = "preview-frame";
          previewFrame.setAttribute("sandbox", "");
          previewFrame.setAttribute("loading", "lazy");
          previewFrame.setAttribute("title", "Converted output preview");
          previewMount.appendChild(previewFrame);
        }
        return previewFrame;
      }

      async function loadPreviewIfNeeded() {
        if (activeTab !== "preview") {
          return;
        }
        if (!lastResult.ok) {
          previewStatus.hidden = false;
          previewStatus.textContent = "Preview unavailable due to conversion error.";
          if (previewFrame) {
            previewFrame.srcdoc = "";
          }
          return;
        }
        if (renderedPreviewVersion === resultVersion) {
          return;
        }

        const seq = ++previewSeq;
        const versionAtStart = resultVersion;
        previewStatus.hidden = false;
        previewStatus.textContent = "Loading preview...";

        try {
          const response = await fetch("/api/preview", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              format: lastResult.target,
              content: lastResult.content
            })
          });
          const data = await response.json();
          if (seq !== previewSeq || activeTab !== "preview") {
            return;
          }
          if (!response.ok) {
            previewStatus.hidden = false;
            previewStatus.textContent = `Preview error: ${data.error || response.statusText}`;
            return;
          }
          const frame = ensurePreviewFrame();
          frame.srcdoc = buildPreviewSrcdoc(data.html || "");
          renderedPreviewVersion = versionAtStart;
          previewStatus.hidden = true;
        } catch (err) {
          if (seq !== previewSeq) {
            return;
          }
          previewStatus.hidden = false;
          previewStatus.textContent = `Preview request failed: ${err.message}`;
        }
      }

      async function runConvert() {
        const seq = ++convertSeq;
        const source = sourceSelect.value;
        const target = targetSelect.value;
        const input = sourceInput.value;
        const strict = strictCheckbox.checked;

        try {
          const response = await fetch("/api/convert", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ source, target, input, strict })
          });
          const data = await response.json();
          if (seq !== convertSeq) {
            return;
          }

          if (typeof data.elapsed_us === "number") {
            elapsedTimeEl.textContent = formatMicroseconds(data.elapsed_us);
          }

          if (!response.ok) {
            lastResult = { target, content: "", ok: false };
            resultVersion += 1;
            rawOutput.textContent = "";
            outputStats.textContent = "0 chars";
            renderDiagnostics(data.error || response.statusText, data.diagnostics || []);
            if (activeTab === "preview") {
              loadPreviewIfNeeded();
            }
            return;
          }

          const content = data.content || "";
          lastResult = { target, content, ok: true };
          resultVersion += 1;
          rawOutput.textContent = content;
          outputStats.textContent = `${content.length.toLocaleString()} chars`;
          renderDiagnostics(null, data.diagnostics || []);

          // Lazy preview: only fetch/render preview if the Preview tab is currently active.
          if (activeTab === "preview") {
            loadPreviewIfNeeded();
          }
        } catch (err) {
          if (seq !== convertSeq) {
            return;
          }
          lastResult = { target, content: "", ok: false };
          resultVersion += 1;
          renderDiagnostics(`Network error: ${err.message}`, []);
        }
      }

      function scheduleConvert() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(runConvert, 120);
      }

      function setActiveTab(tab) {
        activeTab = tab;
        const isPreview = tab === "preview";
        tabRaw.classList.toggle("active", !isPreview);
        tabRaw.setAttribute("aria-selected", String(!isPreview));
        tabPreview.classList.toggle("active", isPreview);
        tabPreview.setAttribute("aria-selected", String(isPreview));
        rawPanel.hidden = isPreview;
        previewPanel.hidden = !isPreview;
        if (isPreview) {
          loadPreviewIfNeeded();
        }
      }

      sourceSelect.addEventListener("change", () => {
        syncTargetOptions();
        runConvert();
      });

      targetSelect.addEventListener("change", () => {
        syncTargetOptions();
        runConvert();
      });

      swapBtn.addEventListener("click", () => {
        const nextSource = targetSelect.value;
        const nextTarget = sourceSelect.value;
        if (!(SUPPORTED_TARGETS[nextSource] || []).includes(nextTarget)) {
          return;
        }
        sourceSelect.value = nextSource;
        syncTargetOptions();
        targetSelect.value = nextTarget;
        syncTargetOptions();
        if (lastResult.ok && lastResult.content) {
          sourceInput.value = lastResult.content;
          updateInputStats();
        }
        runConvert();
      });

      strictCheckbox.addEventListener("change", runConvert);

      sourceInput.addEventListener("input", () => {
        updateInputStats();
        scheduleConvert();
      });

      clearBtn.addEventListener("click", () => {
        sourceInput.value = "";
        updateInputStats();
        runConvert();
      });

      copyBtn.addEventListener("click", async () => {
        if (!lastResult.ok) {
          return;
        }
        try {
          await navigator.clipboard.writeText(lastResult.content);
          const original = copyBtn.textContent;
          copyBtn.textContent = "Copied";
          setTimeout(() => {
            copyBtn.textContent = original;
          }, 1200);
        } catch {
          // Clipboard API may be unavailable on non-localhost HTTP origins.
        }
      });

      tabRaw.addEventListener("click", () => setActiveTab("raw"));
      tabPreview.addEventListener("click", () => setActiveTab("preview"));

      syncTargetOptions();
      updateInputStats();
      runConvert();
    })();
  </script>
</body>
</html>
